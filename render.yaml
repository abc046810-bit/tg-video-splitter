services:
  - type: web
    name: video-tool-bot
    env: python
    plan: free

    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install -r requirements.txt

    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: OWNER_ID
        sync: false

      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false
