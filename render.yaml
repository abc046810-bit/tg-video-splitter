services:
  - type: worker
    name: video-splitter-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/bot.db
      - key: TEMP_DIRECTORY
        value: /tmp/video_splitter
      - key: MAX_FILE_SIZE
        value: "2000"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 5
