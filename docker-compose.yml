version: "3.9"

services:
  bot:
    build: .
    container_name: video_splitter_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TEMP_DIRECTORY=/tmp/video_splitter
      - DATABASE_URL=sqlite+aiosqlite:///data/bot.db
    volumes:
      - ./data:/app/data        # Persistent DB
      - ./logs:/app/logs        # Persistent logs
      - bot_temp:/tmp/video_splitter
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

volumes:
  bot_temp:
